name: Build Instagram Growth Bot Elite

on:
  workflow_dispatch:
  push:
    paths:
      - 'InstagramGrowthBotElite-Android-Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q InstagramGrowthBotElite-Android-Source.zip -d project

      - name: Build Android APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstagramGrowthBotElite-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
